name: Deploy wall-street-wolves
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ledger and prepare static website
        run: |
          unzip -q source.zip -d validation
          cp ledger.json validation/docs/data/ledger.json
          (cd validation && node --experimental-strip-types scripts/validate-data.mjs)
          mkdir _site
          unzip -q site.zip -d _site
          cp ledger.json _site/data/ledger.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
